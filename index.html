<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Admin Lúmina</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
<div style="max-width:380px;margin:100px auto;background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:36px">
  <div class="admin-logo" style="color:var(--marrom);margin-bottom:6px">Lúmina · Admin</div>
  <p style="font-size:13.5px;color:#5B4C43;margin-bottom:24px">Acesso restrito à equipa da loja.</p>
  <div class="formulario" style="max-width:none">
    <div class="campo-formulario"><label>E-mail</label><input type="email" id="lg-email" value=""></div>
    <div class="campo-formulario"><label>Palavra-passe</label><input type="password" id="lg-senha" autocomplete="current-password"></div>
    <div class="campo-formulario"><label>Código 2FA (ou código de recuperação)</label><input type="text" id="lg-2fa" inputmode="numeric" autocomplete="one-time-code" maxlength="64"></div>
    <button class="btn btn-primario" style="width:100%" id="lg-botao">Entrar</button>
    <button class="btn btn-secundario" style="width:100%;margin-top:8px" id="lg-2fa-setup" type="button">Configurar 2FA inicial</button>
    <div id="lg-2fa-box" hidden style="margin-top:12px"><p id="lg-2fa-secret" style="overflow-wrap:anywhere"></p><label for="lg-2fa-setup-code">Código da aplicação autenticadora</label><input id="lg-2fa-setup-code" inputmode="numeric" maxlength="6"><button class="btn btn-primario" type="button" id="lg-2fa-confirmar">Confirmar configuração</button><p id="lg-2fa-recovery" style="overflow-wrap:anywhere"></p></div>
    <p id="lg-erro" style="display:none;color:#B14B33;font-size:13.5px;margin-top:10px"></p>
  </div>
  <p class="link-secundario"><span style="font-size:12px;color:#8A7A70">A palavra-passe é definida no Render/seed do administrador.</span></p>
</div>
<script src="/js/config.js"></script>
<script src="js/api.js"></script><script src="js/i18n-admin.js"></script>
<script src="js/extracted/index-0-5749f81f4924.js"></script>
</body>
</html>
